name: Guide eval

# Scores the guide against golden questions and commits the report. Runs
# nightly and whenever the guide package or its model changes. The Gemini key
# never leaves the server.

on:
  push:
    branches: [main]
    paths:
      - 'packages/guide/**'
      - 'packages/content/data/exhibits.json'
  pull_request:
    paths:
      - 'packages/guide/**'
      - 'packages/content/data/exhibits.json'
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

# Serialize the two bot-commit workflows (this one and narrate) so they never
# push to main concurrently and race on the branch tip.
concurrency:
  group: bot-commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @museum/content build
      - run: pnpm --filter @museum/guide build

      - name: Run guide eval
        run: pnpm --filter @museum/guide eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUIDE_MODEL: ${{ secrets.GUIDE_MODEL || 'gemini-3.8-flash' }}

      - name: Sync with latest main
        # Only push-triggered runs commit to main; PR runs push to the PR branch.
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Commit eval report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'guide: update eval report'
          file_pattern: 'docs/guide/report.md'
