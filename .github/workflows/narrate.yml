name: Narrate

# Regenerates exhibit narration audio when narration text, the pronunciation
# dictionary, or the tool changes. The ElevenLabs key never leaves the server.
# Run manually (workflow_dispatch) to force a full regeneration.

on:
  push:
    branches: [main]
    paths:
      - 'packages/content/data/exhibits.json'
      - 'packages/content/pronunciation/**'
      - 'tools/narrate/**'
  workflow_dispatch:

# Serialize the two bot-commit workflows (this one and guide-eval) so they never
# push to main concurrently and race on the branch tip.
concurrency:
  group: bot-commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @museum/content build

      - name: Generate narration
        run: pnpm --filter @museum/narrate narrate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          NARRATION_MODEL: ${{ secrets.NARRATION_MODEL || 'eleven_multilingual_v2' }}

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Commit generated audio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'narrate: regenerate narration audio'
          file_pattern: 'apps/web/public/audio/* packages/content/data/exhibits.json'
